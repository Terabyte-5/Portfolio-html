<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Grind | Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap');

        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdfaf7; /* Warm cream background */
            color: #3e2723;            /* Rich coffee dark brown */
            margin: 0;
            padding: 0;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #3e2723;
            padding: 15px 30px;
        }

        nav .logo {
            font-family: 'Playfair Display', serif;
            color: #d7ccc8;
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: #fdfaf7;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #bcaaa4; /* Warm latte color */
        }

        /* Hero Banner Section */
        .hero {
            background: linear-gradient(rgba(62, 39, 35, 0.7), rgba(62, 39, 35, 0.7)), 
                        url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 25px;
        }

        /* Interactive Button */
        .cta-btn {
            background-color: #d7ccc8;
            color: #3e2723;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .cta-btn:hover {
            transform: scale(1.05);
            background-color: #bcaaa4;
        }

        /* Quick Menu Grid */
        .featured-section {
            max-width: 1000px;
            margin: 50px auto;
            text-align: center;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .menu-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .menu-item:hover {
            transform: translateY(-5px);
        }

        .menu-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .menu-item h3 {
            margin: 15px 0 5px 0;
        }

        .price {
            color: #8d6e63;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">☕ The Daily Grind</div>
        <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Freshly Brewed Daily</h1>
        <p>Step away from the rush. Experience hand-picked, locally roasted coffee beans crafted with absolute precision.</p>
        <button class="cta-btn" onclick="showWelcomeMessage()">See Today's Special</button>
    </header>

    <section class="featured-section">
        <h2>Our Fan Favorites</h2>
        <div class="grid">
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=400&q=80" alt="Latte Art">
                <h3>Vanilla Latte</h3>
                <p class="price">₦3,500</p>
            </div>
            <div class="menu-item">
                <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=400&q=80" alt="Iced Coffee">
                <h3>Cold Brew Frost</h3>
                <p class="price">₦4,000</p>
            </div>
        </div>
    </section>

    <script>
        function showWelcomeMessage() {
            alert("☕ Today's Special: Buy 1 Caramel Macchiato, get a free coconut snowball biscuit! 🥥✨");
        }
    </script>
</body>
</html>
